apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kafka-consumer-scaler
  labels:
    app: kafka-consumer
spec:
  scaleTargetRef:
    name: kafka-consumer
  pollingInterval: 10
  cooldownPeriod: 30
  minReplicaCount: 1
  maxReplicaCount: 10
  triggers:
    - type: external
      metadata:
        scalerAddress: lag-scaler.default.svc.cluster.local:50051
        topic: test-topic
        consumerGroup: sample-consumer-group
        # The scaler reports the desired consumer count as the metric value
        # (target 1), so HPA's desired replicas equal it. Tuning knobs
        # (maxDrainSeconds, trendWindowSeconds, ...) are set as env vars on the
        # lag-scaler Deployment, not here.
