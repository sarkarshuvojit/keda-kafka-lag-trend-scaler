name: Release

# Push a tag like v0.2.0 to publish. Runs the full CI first, then pushes
# multi-arch images to GHCR and creates a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write

  images:
    name: Publish · ${{ matrix.name }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lag-trend-scaler
            context: scaler
          - name: lag-trend-sample-app
            context: examples/sample-app
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.description=Kafka lag trend scaler for KEDA (${{ matrix.name }})

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}

  release:
    name: GitHub Release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ### Images

            ```
            ghcr.io/${{ github.repository_owner }}/lag-trend-scaler:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/lag-trend-sample-app:${{ github.ref_name }}
            ```

            Multi-arch: `linux/amd64`, `linux/arm64`.
