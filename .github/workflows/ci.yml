name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaler:
    name: Scaler · unit + Kafka integration
    runs-on: ubuntu-latest
    permissions:
      # Only used on main, to publish the coverage badge to the `badges` branch.
      contents: write
    services:
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    defaults:
      run:
        working-directory: scaler
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: scaler/go.mod
          cache-dependency-path: scaler/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet -tags integration ./...

      - name: Test (race, coverage, real Kafka)
        env:
          KAFKA_BROKERS: localhost:9092
        run: |
          # Coverage counts every hand-written package. Generated protobuf code
          # and main's wiring are excluded.
          pkgs="$(go list ./pkg/... | grep -v /externalscaler | paste -sd, -)"
          go test -race -tags integration -covermode=atomic \
            -coverpkg="$pkgs" -coverprofile=coverage.out ./...

      - name: Coverage report
        id: coverage
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          {
            echo "### Coverage: ${total}%"
            echo
            echo '```'
            go tool cover -func=coverage.out | sed 's#^github.com/[^/]*/[^/]*/scaler/##'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: scaler/coverage.out

      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ runner.temp }}
        env:
          TOTAL: ${{ steps.coverage.outputs.total }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          color="$(awk -v t="$TOTAL" 'BEGIN { print (t >= 90 ? "brightgreen" : t >= 75 ? "green" : t >= 60 ? "yellow" : "red") }')"
          mkdir badges && cd badges
          git init -q
          git checkout -q --orphan badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$TOTAL" "$color" > coverage.json
          git add coverage.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "coverage: ${TOTAL}%"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  sample-app:
    name: Sample app · fmt, vet, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/sample-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/sample-app/go.mod
          cache-dependency-path: examples/sample-app/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - run: go vet ./...
      - run: go build ./...

  images:
    name: Image · ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lag-trend-scaler
            context: scaler
          - name: lag-trend-sample-app
            context: examples/sample-app
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: ${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
      - name: Validate
        run: |
          # KEDA's ScaledObject schema comes from the community CRD catalog.
          find examples/k8s -name '*.yaml' -print0 | xargs -0 "$RUNNER_TEMP/kubeconform" \
            -strict -summary -output pretty \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
